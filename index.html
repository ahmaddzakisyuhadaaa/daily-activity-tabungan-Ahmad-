<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><meta name="description" content="Aplikasi Daily Activity dan pencatatan target tabungan."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Daily & Tabungan</title><style>
:root{--bg:#0b1220;--panel:#141f31;--panel2:#1b2940;--text:#f2f5fb;--muted:#9eacc2;--green:#4bd4a0;--blue:#79a9ff;--line:#293850}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Arial}header{padding:22px 18px 14px;background:linear-gradient(135deg,#172b48,#101827)}h1{font-size:22px;margin:0 0 4px}small,.muted{color:var(--muted)}main{padding:14px 14px 88px;max-width:760px;margin:auto}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101827;border-top:1px solid var(--line);padding:8px;z-index:5}.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px;font-weight:650}.tabs button.active{color:var(--green)}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--panel2);border-radius:13px;padding:13px}.stat b{display:block;font-size:20px;margin-top:5px}.bar{height:9px;background:#293850;border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--green);width:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.section{font-size:17px;font-weight:750;margin:18px 2px 8px}.select,input{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px;width:100%;font:inherit}.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.task input{width:20px;height:20px;accent-color:var(--green);flex:none}.task.done .taskname{text-decoration:line-through;color:var(--muted)}.time{font-size:12px;color:var(--blue);min-width:94px}.primary{background:var(--green);color:#082116;border:0;border-radius:10px;padding:12px 15px;font-weight:750}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}.deposit{padding:12px 0;border-bottom:1px solid var(--line)}.pill{font-size:12px;background:#20344b;color:#bcd2f3;padding:4px 8px;border-radius:20px}.money{font-variant-numeric:tabular-nums}
</style></head><body><header><h1>Daily Activity & Tabungan</h1><small>Rencana aktivitas dan target finansial dalam satu aplikasi</small></header><main id="app"></main><nav class="tabs"><button class="active" data-tab="home">Ringkasan</button><button data-tab="daily">Aktivitas</button><button data-tab="saving">Tabungan</button></nav><script>
let DATA,state=JSON.parse(localStorage.getItem('datab_state')||'{}');const rupiah=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');const el=s=>document.querySelector(s);const save=()=>localStorage.setItem('datab_state',JSON.stringify(state));const allTasks=()=>DATA.activityMonths.flatMap(m=>m.days.flatMap(d=>d.tasks.map((t,i)=>({key:d.date+'_'+i,...t,date:d.date,month:m.name,day:d.day}))));const isDone=k=>!!state.tasks?.[k];function totals(){let a=allTasks(),done=a.filter(t=>isDone(t.key)).length;return{total:a.length,done,left:a.length-done,pct:a.length?done/a.length*100:0}}function deposits(){return DATA.savings.deposits.map((d,i)=>({...d,...(state.deposits?.[i]||{}),i}))}function savingsTotal(){return DATA.savings.openingBalance+deposits().reduce((s,d)=>s+Number(d.amount||0),0)}function show(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({home,daily,saving}[tab])()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function home(){let t=totals(),s=savingsTotal(),p=s/DATA.savings.targetTotal*100;el('#app').innerHTML=`<div class="stats"><div class="stat"><small>Aktivitas selesai</small><b>${t.done}/${t.total}</b><small>${t.pct.toFixed(1)}% progres</small></div><div class="stat"><small>Tabungan aktual</small><b class="money">${rupiah(s)}</b><small>${p.toFixed(1)}% dari target</small></div></div><div class="card"><div class="row"><b>Progres aktivitas</b><span>${t.pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${t.pct}%"></i></div><div class="row muted"><small>${t.done} selesai</small><small>${t.left} tersisa</small></div></div><div class="card"><div class="row"><b>Target tabungan</b><span class="pill">Juni 2028</span></div><h2 class="money">${rupiah(s)}</h2><div class="bar"><i style="width:${Math.min(100,p)}%"></i></div><div class="row muted"><small>Target ${rupiah(DATA.savings.targetTotal)}</small><small>${p.toFixed(1)}%</small></div><p class="muted">Saldo awal ${rupiah(DATA.savings.openingBalance)} · Rencana setoran ${rupiah(DATA.savings.monthlyTarget)}/bulan</p></div><div class="section">Akses cepat</div><div class="row"><button class="primary" onclick="show('daily')">Checklist aktivitas</button><button class="secondary" onclick="show('saving')">Catat setoran</button></div>`}
function daily(){let opts=DATA.activityMonths.map((m,i)=>`<option value="${i}">${m.name}</option>`).join('');el('#app').innerHTML=`<div class="section">Jadwal aktivitas</div><select class="select" id="month">${opts}</select><div class="field"><input id="datefilter" type="date"></div><div id="tasks"></div>`;let now=new Date();el('#month').value=0;el('#datefilter').value=now.toISOString().slice(0,10);el('#month').onchange=renderTasks;el('#datefilter').onchange=renderTasks;renderTasks()}
function renderTasks(){let m=DATA.activityMonths[+el('#month').value],date=el('#datefilter').value,days=m.days.filter(d=>!date||d.date===date);if(!days.length){el('#tasks').innerHTML='<div class="card muted">Tidak ada jadwal pada tanggal ini. Pilih tanggal yang tersedia pada bulan tersebut.</div>';return}el('#tasks').innerHTML=days.map(d=>`<div class="card"><div class="row"><b>${d.day}, ${d.date}</b><span class="pill">${d.tasks.filter((t,i)=>isDone(d.date+'_'+i)).length}/${d.tasks.length} selesai</span></div>${d.tasks.map((t,i)=>{let k=d.date+'_'+i;return `<label class="task ${isDone(k)?'done':''}"><input type="checkbox" ${isDone(k)?'checked':''} onchange="toggleTask('${k}',this.checked)"><span class="time">${t.time}</span><span class="taskname">${t.name}</span></label>`}).join('')}</div>`).join('')}
function toggleTask(k,v){state.tasks=state.tasks||{};state.tasks[k]=v;save();renderTasks()}
function saving(){let ds=deposits(),actual=savingsTotal(),pct=actual/DATA.savings.targetTotal*100;el('#app').innerHTML=`<div class="card"><small>Saldo awal November 2026</small><h2 class="money">${rupiah(DATA.savings.openingBalance)}</h2><div class="row"><b>Tabungan aktual</b><b class="money">${rupiah(actual)}</b></div><div class="bar"><i style="width:${Math.min(100,pct)}%"></i></div><div class="row muted"><small>Target ${rupiah(DATA.savings.targetTotal)}</small><small>${pct.toFixed(1)}%</small></div><p class="muted">Sisa menuju target: ${rupiah(Math.max(0,DATA.savings.targetTotal-actual))}</p></div><div class="section">Catatan setoran bulanan</div>${ds.map(d=>`<div class="card deposit"><div class="row"><b>${d.label}</b><span class="pill">Target ${rupiah(DATA.savings.monthlyTarget)}</span></div><div class="field"><label>Tanggal setoran</label><input type="date" value="${d.date||''}" onchange="setDeposit(${d.i},'date',this.value)"></div><div class="field"><label>Bank tempat setoran</label><input placeholder="Nama bank" value="${esc(d.bank||'')}" onchange="setDeposit(${d.i},'bank',this.value)"></div><div class="field"><label>Jumlah setoran aktual (Rp)</label><input type="number" min="0" inputmode="numeric" placeholder="0" value="${d.amount||''}" onchange="setDeposit(${d.i},'amount',this.value)"></div></div>`).join('')}`}
function setDeposit(i,k,v){state.deposits=state.deposits||{};state.deposits[i]=state.deposits[i]||{};state.deposits[i][k]=v;save();if(k==='amount')saving()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}fetch('./data.json').then(r=>r.json()).then(d=>{DATA=d;show('home')}).catch(()=>el('#app').textContent='Gagal memuat data aplikasi.');
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
